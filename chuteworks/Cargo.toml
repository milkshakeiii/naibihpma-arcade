[package]
name = "chuteworks"
version = "0.1.0"
edition = "2021"

[dependencies]
winapi = { version = "0.3.9", features = [
    "winuser",
    "wingdi",
    "libloaderapi",
    "minwindef",
    "windef",
] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1
