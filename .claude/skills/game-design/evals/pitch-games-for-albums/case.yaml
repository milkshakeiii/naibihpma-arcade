schema_version: "1.1"
name: pitch-games-for-albums
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Two or three one-sentence pitches and a short question, nothing else, presented
  neutrally. Each is a complete game on its own, set in a named album's world with a
  pace that suits its mood, with no rule that depends on hearing the music; none puts
  planning under an unstoppable clock; all work keyboard-only. The set mixes ideas
  near Henry's favourites with at least one unlike any of them.
