[package]
name = "monster_workshop"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
miniz_oxide = "0.8"

# Only the player's game on Windows draws a window and plays sounds; a server runs anywhere.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = [
    "winuser",
    "wingdi",
    "libloaderapi",
    "minwindef",
    "windef",
] }
